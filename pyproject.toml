[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adb-scraper"
version = "0.1.0"
description = "Scrapes ADB's Consultant Management System (cms.adb.org) for NGO-suitable project consulting notices, enriches them with OpenAI relevance context, and stores them in SQLite + JSON"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "openai>=3.0,<4",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
adb-scraper = "adb_scraper.main:main"

[tool.setuptools.packages.find]
where = ["src"]
